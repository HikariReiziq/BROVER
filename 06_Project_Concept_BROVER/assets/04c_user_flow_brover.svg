  <text x="250.0" y="618" font-family="'Open Sans', sans-serif" font-size="11.4" fill="#475569">Data kandang hanya dikirim ke dokter hewan bila peternak menekan tombol Laporkan.</text>
  <text x="250.0" y="637" font-family="'Open Sans', sans-serif" font-size="11.4" fill="#475569">Foto BROVER Saku disimpan di server hanya dengan persetujuan peternak.</text>
  <text x="250.0" y="656" font-family="'Open Sans', sans-serif" font-size="11.4" fill="#475569">AI hanya skrining, bukan diagnosis; dasbor tidak pernah menampilkan resep atau dosis antibiotik.</text>
  
