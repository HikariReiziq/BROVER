  <rect width="1600" height="820" fill="#FFFFFF"/>
  <text x="800.0" y="46" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="26.5" font-weight="800" fill="#0F172A">Titik Impas Paket BROVER bagi Peternak</text>
  <text x="800.0" y="72" text-anchor="middle" font-family="'Open Sans', sans-serif" font-size="13.2" fill="#475569">Berapa ekor ayam yang harus terselamatkan per siklus agar biaya paket tertutup? Ini hipotesis pilot, bukan klaim manfaat.</text>

  <rect x="36" y="92" width="960" height="664" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6" filter="url(#cardShadow)"/>
  <text x="64" y="126" font-family="'Montserrat', sans-serif" font-size="16" font-weight="800" fill="#0F172A">Titik Impas vs Kematian Normal per Siklus</text>
  <text x="64" y="148" font-family="'Open Sans', sans-serif" font-size="11.6" fill="#475569">Titik impas = harga paket ÷ nilai 1 ekor ayam terselamatkan (Rp22.700–36.200).</text>
  <text x="64" y="166" font-family="'Open Sans', sans-serif" font-size="11.6" fill="#475569">Kematian normal: deplesi 2,47% kandang tertutup dan 4,54% kandang terbuka (Zulfan et al., 2025).</text>
  <rect x="64" y="179" width="14" height="14" rx="3" fill="#2563EB"/><text x="84" y="190" font-family="'Open Sans', sans-serif" font-size="11.4" font-weight="600" fill="#334155">BROVER Kandang</text><rect x="206" y="179" width="14" height="14" rx="3" fill="#D97706"/><text x="226" y="190" font-family="'Open Sans', sans-serif" font-size="11.4" font-weight="600" fill="#334155">BROVER Saku</text><rect x="332" y="179" width="14" height="14" rx="3" fill="#2563EB" opacity="0.45"/><text x="352" y="190" font-family="'Open Sans', sans-serif" font-size="11.4" font-weight="600" fill="#334155">Warna pucat: rentang sampai nilai ayam terendah</text><rect x="674" y="179" width="14" height="14" rx="3" fill="#CBD5E1"/><text x="694" y="190" font-family="'Open Sans', sans-serif" font-size="11.4" font-weight="600" fill="#334155">Kematian normal per siklus</text>
  <line x1="336.0" y1="216" x2="336.0" y2="646" stroke="#E2E8F0" stroke-width="1"/><text x="336.0" y="664" text-anchor="middle" font-family="'Open Sans', sans-serif" font-size="11" font-weight="600" fill="#64748B">0</text><line x1="454.0" y1="216" x2="454.0" y2="646" stroke="#E2E8F0" stroke-width="1"/><text x="454.0" y="664" text-anchor="middle" font-family="'Open Sans', sans-serif" font-size="11" font-weight="600" fill="#64748B">100</text><line x1="572.0" y1="216" x2="572.0" y2="646" stroke="#E2E8F0" stroke-width="1"/><text x="572.0" y="664" text-anchor="middle" font-family="'Open Sans', sans-serif" font-size="11" font-weight="600" fill="#64748B">200</text><line x1="690.0" y1="216" x2="690.0" y2="646" stroke="#E2E8F0" stroke-width="1"/><text x="690.0" y="664" text-anchor="middle" font-family="'Open Sans', sans-serif" font-size="11" font-weight="600" fill="#64748B">300</text><line x1="808.0" y1="216" x2="808.0" y2="646" stroke="#E2E8F0" stroke-width="1"/><text x="808.0" y="664" text-anchor="middle" font-family="'Open Sans', sans-serif" font-size="11" font-weight="600" fill="#64748B">400</text><line x1="926.0" y1="216" x2="926.0" y2="646" stroke="#E2E8F0" stroke-width="1"/><text x="926.0" y="664" text-anchor="middle" font-family="'Open Sans', sans-serif" font-size="11" font-weight="600" fill="#64748B">500</text><line x1="336" y1="646" x2="926" y2="646" stroke="#94A3B8" stroke-width="1.2"/><text x="631.0" y="684" text-anchor="middle" font-family="'Open Sans', sans-serif" font-size="11.4" font-weight="700" fill="#334155">Ekor ayam per siklus</text><circle cx="70" cy="250" r="6" fill="#2563EB"/><text x="84" y="254" font-family="'Montserrat', sans-serif" font-size="12.4" font-weight="800" fill="#0F172A">BROVER Kandang · Rp750 rb</text><text x="84" y="273" font-family="'Open Sans', sans-serif" font-size="11.6" fill="#334155">Kandang tertutup 10.000 ekor</text><text x="336" y="242.0" font-family="'Open Sans', sans-serif" font-size="11.4" fill="#334155">Titik impas <tspan font-weight="800" fill="#0F172A">21–33 ekor</tspan> = 8,4–13,4% dari kematian normal</text><rect x="336" y="250.0" width="291.5" height="20" rx="4" fill="#CBD5E1"/><rect x="336" y="250.0" width="39.0" height="20" rx="4" fill="#2563EB" opacity="0.45"/><rect x="336" y="250.0" width="24.4" height="20" rx="4" fill="#2563EB"/><rect x="375.0" y="250.0" width="2" height="20" fill="#FFFFFF"/><text x="635.5" y="264.5" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#0F172A">247 ekor</text><circle cx="70" cy="338" r="6" fill="#2563EB"/><text x="84" y="342" font-family="'Montserrat', sans-serif" font-size="12.4" font-weight="800" fill="#0F172A">BROVER Kandang · Rp750 rb</text><text x="84" y="361" font-family="'Open Sans', sans-serif" font-size="11.6" fill="#334155">Kandang tertutup 15.000 ekor</text><text x="336" y="330.0" font-family="'Open Sans', sans-serif" font-size="11.4" fill="#334155">Titik impas <tspan font-weight="800" fill="#0F172A">21–33 ekor</tspan> = 5,6–8,9% dari kematian normal</text><rect x="336" y="338.0" width="437.2" height="20" rx="4" fill="#CBD5E1"/><rect x="336" y="338.0" width="39.0" height="20" rx="4" fill="#2563EB" opacity="0.45"/><rect x="336" y="338.0" width="24.4" height="20" rx="4" fill="#2563EB"/><rect x="375.0" y="338.0" width="2" height="20" fill="#FFFFFF"/><text x="781.2" y="352.5" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#0F172A">370 ekor</text><circle cx="70" cy="426" r="6" fill="#2563EB"/><text x="84" y="430" font-family="'Montserrat', sans-serif" font-size="12.4" font-weight="800" fill="#0F172A">BROVER Kandang · Rp750 rb</text><text x="84" y="449" font-family="'Open Sans', sans-serif" font-size="11.6" fill="#334155">Kandang tertutup 20.000 ekor</text><text x="336" y="418.0" font-family="'Open Sans', sans-serif" font-size="11.4" fill="#334155">Titik impas <tspan font-weight="800" fill="#0F172A">21–33 ekor</tspan> = 4,2–6,7% dari kematian normal</text><rect x="336" y="426.0" width="582.9" height="20" rx="4" fill="#CBD5E1"/><rect x="336" y="426.0" width="39.0" height="20" rx="4" fill="#2563EB" opacity="0.45"/><rect x="336" y="426.0" width="24.4" height="20" rx="4" fill="#2563EB"/><rect x="375.0" y="426.0" width="2" height="20" fill="#FFFFFF"/><text x="926.9" y="440.5" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#0F172A">494 ekor</text><circle cx="70" cy="514" r="6" fill="#D97706"/><text x="84" y="518" font-family="'Montserrat', sans-serif" font-size="12.4" font-weight="800" fill="#0F172A">BROVER Saku · Rp75 rb</text><text x="84" y="537" font-family="'Open Sans', sans-serif" font-size="11.6" fill="#334155">Kandang terbuka 3.000 ekor</text><text x="336" y="506.0" font-family="'Open Sans', sans-serif" font-size="11.4" fill="#334155">Titik impas <tspan font-weight="800" fill="#0F172A">2,1–3,3 ekor</tspan> = 1,5–2,4% dari kematian normal</text><rect x="336" y="514.0" width="160.7" height="20" rx="4" fill="#CBD5E1"/><rect x="336" y="514.0" width="4.0" height="20" rx="4" fill="#D97706" opacity="0.45"/><rect x="336" y="514.0" width="2.5" height="20" rx="4" fill="#D97706"/><rect x="340.0" y="514.0" width="2" height="20" fill="#FFFFFF"/><text x="504.7" y="528.5" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#0F172A">136 ekor</text><circle cx="70" cy="602" r="6" fill="#D97706"/><text x="84" y="606" font-family="'Montserrat', sans-serif" font-size="12.4" font-weight="800" fill="#0F172A">BROVER Saku · Rp75 rb</text><text x="84" y="625" font-family="'Open Sans', sans-serif" font-size="11.6" fill="#334155">Kandang terbuka 5.000 ekor</text><text x="336" y="594.0" font-family="'Open Sans', sans-serif" font-size="11.4" fill="#334155">Titik impas <tspan font-weight="800" fill="#0F172A">2,1–3,3 ekor</tspan> = 0,9–1,5% dari kematian normal</text><rect x="336" y="602.0" width="267.9" height="20" rx="4" fill="#CBD5E1"/><rect x="336" y="602.0" width="4.0" height="20" rx="4" fill="#D97706" opacity="0.45"/><rect x="336" y="602.0" width="2.5" height="20" rx="4" fill="#D97706"/><rect x="340.0" y="602.0" width="2" height="20" fill="#FFFFFF"/><text x="611.9" y="616.5" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#0F172A">227 ekor</text>
  <text x="64" y="722" font-family="'Open Sans', sans-serif" font-size="11" fill="#64748B">Cara baca: bagian berwarna adalah ayam yang harus terselamatkan agar biaya paket tertutup; abu-abu adalah kematian normal satu siklus.</text>
  <text x="64" y="740" font-family="'Open Sans', sans-serif" font-size="11" fill="#64748B">Pengaruh BROVER terhadap kematian belum diukur; pilot membandingkan deplesi dan FCR antarflok bersama dokter hewan.</text>

  <rect x="1020" y="92" width="544" height="214" rx="18" fill="#FFFFFF" stroke="#5EEAD4" stroke-width="1.8" filter="url(#cardShadow)"/><path d="M1038 92 H1546 Q1564 92 1564 110 V138 H1020 V110 Q1020 92 1038 92 Z" fill="#0F766E"/><text x="1042" y="121" font-family="'Montserrat', sans-serif" font-size="13.6" font-weight="800" fill="#FFFFFF">Nilai 1 Ekor Ayam Terselamatkan</text><text x="1042" y="176" text-anchor="start" font-family="'Montserrat', sans-serif" font-size="22" font-weight="800" fill="#0F172A">Rp22.700 – Rp36.200 per ekor</text><text x="1042" y="204" text-anchor="start" font-family="'Open Sans', sans-serif" font-size="11.6" font-weight="600" fill="#334155">= bobot panen 2,0 kg × harga ayam hidup Rp19.500–25.000/kg</text><text x="1042" y="224" text-anchor="start" font-family="'Open Sans', sans-serif" font-size="11.6" font-weight="600" fill="#334155">− sisa pakan ~1,73 kg × harga pakan Rp8.000–9.400/kg</text><text x="1042" y="250" text-anchor="start" font-family="'Open Sans', sans-serif" font-size="10.6" font-weight="400" fill="#64748B">Ayam terselamatkan hari ke-21 (0,925 kg); FCR grower–finisher 1,61</text><text x="1042" y="267" text-anchor="start" font-family="'Open Sans', sans-serif" font-size="10.6" font-weight="400" fill="#64748B">(Zulfan et al., 2025). Harga ayam: Kementan 2026 dan Perbadan 6/2024.</text><text x="1042" y="284" text-anchor="start" font-family="'Open Sans', sans-serif" font-size="10.6" font-weight="400" fill="#64748B">Harga pakan: asumsi tim dari pernyataan asosiasi peternak di media.</text>
  <rect x="1020" y="322" width="544" height="270" rx="18" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.8" filter="url(#cardShadow)"/><path d="M1038 322 H1546 Q1564 322 1564 340 V368 H1020 V340 Q1020 322 1038 322 Z" fill="#1D4ED8"/><text x="1042" y="351" font-family="'Montserrat', sans-serif" font-size="13.6" font-weight="800" fill="#FFFFFF">Harga Paket BROVER</text><circle cx="1050" cy="396" r="6" fill="#D97706"/><text x="1064" y="400" text-anchor="start" font-family="'Montserrat', sans-serif" font-size="12.4" font-weight="800" fill="#0F172A">BROVER Saku</text><text x="1542" y="400" text-anchor="end" font-family="'Montserrat', sans-serif" font-size="12.6" font-weight="800" fill="#0F172A">Rp75.000 / siklus</text><text x="1064" y="419" text-anchor="start" font-family="'Open Sans', sans-serif" font-size="11" font-weight="400" fill="#475569">Foto HP, tanpa perangkat, tanpa kontrak minimum</text><line x1="1042" y1="432" x2="1542" y2="432" stroke="#E2E8F0" stroke-width="1"/><circle cx="1050" cy="456" r="6" fill="#2563EB"/><text x="1064" y="460" text-anchor="start" font-family="'Montserrat', sans-serif" font-size="12.4" font-weight="800" fill="#0F172A">BROVER Kandang · Langganan</text><text x="1542" y="460" text-anchor="end" font-family="'Montserrat', sans-serif" font-size="12.6" font-weight="800" fill="#0F172A">Rp750.000 / siklus</text><text x="1064" y="479" text-anchor="start" font-family="'Open Sans', sans-serif" font-size="11" font-weight="400" fill="#475569">Rover per kandang, minimal 6 siklus, perawatan oleh tim</text><line x1="1042" y1="492" x2="1542" y2="492" stroke="#E2E8F0" stroke-width="1"/><circle cx="1050" cy="516" r="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.4"/><text x="1064" y="520" text-anchor="start" font-family="'Montserrat', sans-serif" font-size="12.4" font-weight="800" fill="#0F172A">BROVER Kandang · Beli Putus</text><text x="1542" y="520" text-anchor="end" font-family="'Montserrat', sans-serif" font-size="12.6" font-weight="800" fill="#0F172A">Usulan Rp11,5 jt / unit</text><text x="1064" y="539" text-anchor="start" font-family="'Open Sans', sans-serif" font-size="11" font-weight="400" fill="#475569">Termasuk cloud 6 siklus, lalu iuran opsional Rp75 rb/siklus</text><text x="1042" y="572" text-anchor="start" font-family="'Open Sans', sans-serif" font-size="10.6" font-weight="400" fill="#64748B">Ditagih setelah panen, saat RHPP terbit (Amam &amp; Harsita, 2024).</text>
  <rect x="1020" y="608" width="544" height="148" rx="18" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.8" filter="url(#cardShadow)"/><path d="M1038 608 H1546 Q1564 608 1564 626 V654 H1020 V626 Q1020 608 1038 608 Z" fill="#047857"/><text x="1042" y="637" font-family="'Montserrat', sans-serif" font-size="13.6" font-weight="800" fill="#FFFFFF">Langganan vs Beli Putus selama 3 Tahun (18 Siklus)</text><text x="1042" y="684" text-anchor="start" font-family="'Montserrat', sans-serif" font-size="12.4" font-weight="800" fill="#0F172A">Langganan</text><text x="1542" y="684" text-anchor="end" font-family="'Montserrat', sans-serif" font-size="12.6" font-weight="800" fill="#0F172A">Rp13,5 jt</text><text x="1042" y="702" text-anchor="start" font-family="'Open Sans', sans-serif" font-size="11" font-weight="400" fill="#475569">Rp750 rb × 18 siklus, tanpa modal awal, perawatan oleh tim</text><text x="1042" y="728" text-anchor="start" font-family="'Montserrat', sans-serif" font-size="12.4" font-weight="800" fill="#0F172A">Beli putus</text><text x="1542" y="728" text-anchor="end" font-family="'Montserrat', sans-serif" font-size="12.6" font-weight="800" fill="#0F172A">~Rp13,3 jt</text><text x="1042" y="746" text-anchor="start" font-family="'Open Sans', sans-serif" font-size="11" font-weight="400" fill="#475569">Rp11,5 jt + iuran cloud Rp0,9 jt + ganti sensor &amp; baterai ~Rp0,9 jt</text>

  <rect x="36" y="770" width="1528" height="34" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
